name: repro
on:
  workflow_dispatch:
    inputs:
      native_runs:
        description: runs per case on the native riscv64 runner
        default: '15'
      qemu_runs:
        description: runs per case under QEMU
        default: '12'
      native_rounds:
        description: PureJavaVt rounds per run on native (more rounds = more freeze/thaw + sampler exposure)
        default: '400'
      run_native:
        description: run the native RISE job
        default: 'true'
      cases:
        description: space separated cases (empty = all)
        default: ''
      qemu_rounds:
        description: PureJavaVt rounds per run under QEMU
        default: '50'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-riscv64:
    name: native riscv64 (RISE runner)
    if: ${{ inputs.run_native != 'false' }}
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - name: Install JDK 25
        run: |
          SUDO=""; [ "$(id -u)" = 0 ] || SUDO=sudo
          $SUDO apt-get update -q
          $SUDO apt-get install -q -y openjdk-25-jdk-headless
          # The runner image ships Temurin 17 and sets JAVA_HOME to it.
          echo "JAVA_HOME=/usr/lib/jvm/java-25-openjdk-$(dpkg --print-architecture)" >> "$GITHUB_ENV"
      - name: Run matrix
        run: ./run-matrix.sh native-riscv64 "${{ inputs.native_runs || '15' }}" "${{ inputs.native_rounds || '400' }}" "${{ inputs.cases }}"
      - name: Publish summary
        if: always()
        run: cat results/native-riscv64/env.md results/native-riscv64/summary.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-riscv64
          path: results/
          if-no-files-found: ignore

  qemu-riscv64:
    name: QEMU riscv64 (same as sqlite-jdbc CI)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
      - uses: uraimo/run-on-arch-action@v3
        with:
          arch: riscv64
          distro: ubuntu_latest
          githubToken: ${{ github.token }}
          install: |
            apt-get update -q -y
            apt-get install -q -y openjdk-25-jdk-headless
          dockerRunArgs: |
            --volume "${PWD}:/work"
          run: |
            mkdir -p /work/results && cd /work && ./run-matrix.sh qemu-riscv64 "${{ inputs.qemu_runs || '12' }}" "${{ inputs.qemu_rounds || '50' }}" "${{ inputs.cases }}"
      - name: Publish summary
        if: always()
        run: cat results/qemu-riscv64/env.md results/qemu-riscv64/summary.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qemu-riscv64
          path: results/
          if-no-files-found: ignore
